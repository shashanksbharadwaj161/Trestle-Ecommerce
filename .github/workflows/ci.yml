name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: foundry-rs/foundry-toolchain@v1
      - run: pnpm contracts:test

  app:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trestle
          POSTGRES_PASSWORD: trestle
          POSTGRES_DB: trestle_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trestle" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://trestle:trestle@localhost:5432/trestle_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate:deploy
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm --filter @trestle/shared test
      - run: pnpm --filter @trestle/web test
      - run: pnpm build
        env:
          NETWORK_MODE: local
          SIWE_SECRET: ci-only-siwe-secret-0123456789abcdef0123456789
      - run: pnpm --filter @trestle/web relayer:build
