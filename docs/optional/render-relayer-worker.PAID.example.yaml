# ⚠️  PAID — NOT USED BY THE DEFAULT (FREE) DEPLOYMENT. Kept only as a reference.
#
# Render "Background Worker" services have no free plan, so an always-on relayer costs money. The project owner
# has asked for a fully free deployment, so this file is deliberately NOT named render.yaml (Render would pick a
# root render.yaml up as a Blueprint). Do not apply it unless the owner explicitly chooses to pay for a worker.
# It no longer creates a Render database: Postgres is the existing Supabase project (DATABASE_URL is external).
# Render's free *web service* tier sleeps when idle, so it is NOT a substitute for this worker.
#
# Free alternative: run `pnpm --filter @trestle/web relayer:once` on demand (see docs/DEPLOYMENT.md).

services:
  - type: worker
    name: trestle-relayer
    runtime: node
    plan: starter # paid
    rootDir: .
    buildCommand: >-
      (corepack enable || npm install -g pnpm@10.33.0) &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @trestle/db generate &&
      pnpm --filter @trestle/web relayer:build
    startCommand: pnpm --filter @trestle/web relayer:start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NETWORK_MODE
        value: testnet
      # Supabase transaction pooler URL (external; never create a Render database)
      - key: DATABASE_URL
        sync: false
      - key: SEPOLIA_RPC_URL
        sync: false
      - key: BASE_SEPOLIA_RPC_URL
        sync: false
      - key: RELAYER_PRIVATE_KEY
        sync: false
      - key: ATTESTER_PRIVATE_KEY
        sync: false
      # webhook mode: the worker posts HMAC-signed events to the Vercel app (spec §7)
      - key: RELAYER_SYNC_MODE
        value: webhook
      - key: RELAYER_WEBHOOK_URL
        sync: false
      - key: RELAYER_WEBHOOK_SECRET
        sync: false
      - key: PRICE_ETH_USD
        value: "3000"
      - key: RELAYER_POLL_MS
        value: "6000"
      - key: RELAYER_MAX_BLOCK_RANGE
        value: "1000"
      - key: LOG_LEVEL
        value: info
